# Curated constants for the verify gate, beyond scipy's CODATA table (which it checks second).
# Names match case-insensitively inside a check's quantity. Nuclear data comes from NNDC; cite the source.
constants:
  Wien displacement constant:
    value: 2.897771955e-3 m K
    source: CODATA 2018 (scipy calls it "Wien wavelength displacement law constant")
  speed of light:
    value: 299792458 m/s
    source: exact (SI)
  energy released per U-235 fission:
    value: 202.5 MeV
    source: total recoverable energy per thermal U-235 fission, ~200 MeV (NNDC/ENDF; lecture rounds to 200)
  kinetic energy of U-235 fission fragments:
    value: 168 MeV
    source: NNDC/ENDF-B, fragments' kinetic energy per thermal fission
  specific heat of water:
    value: 4186 J/(kg K)
    source: Young & Freedman 15e Table 17.3 (water at 15 °C); CRC gives 4.1855 kJ/(kg K)
  latent heat of fusion of water:
    value: 3.34e5 J/kg
    source: Young & Freedman 15e Table 17.4 (333.55 kJ/kg, CRC)
  triple point of water:
    value: 273.16 K
    source: the pre-2019 definition of the kelvin; still 273.16 K to within 0.1 mK
