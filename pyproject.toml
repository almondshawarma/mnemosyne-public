[project]
name = "mnemosyne"
version = "0.0.0"
description = "Helios memory module: generates, verifies, schedules, and surfaces Anki cards."
requires-python = ">=3.12,<3.13"
dependencies = [
    "apscheduler>=3.10,<4",
    "fastapi>=0.115",
    "httpx>=0.28",
    "mcp>=1.28,<2",
    "pint>=0.26.1",
    "pydantic>=2.9",
    "pydantic-settings>=2.7",
    "pymupdf>=1.28.2",
    "pyyaml>=6.0.3",
    "scipy>=1.18.1",
    "structlog>=24",
    "uvicorn[standard]>=0.34",
]

[project.scripts]
mnemosyne = "mnemosyne.__main__:main"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mnemosyne"]

[dependency-groups]
dev = [
    "anki>=26.9,<27", # tests only: builds throwaway fixture collections, never opens a real one
    "pyright>=1.1.400",
    "pytest>=8",
    "pyyaml>=6.0.3",
    "ruff>=0.12",
    "types-pyyaml>=6.0.12.20260906",
    "zstandard>=0.23",
]

[tool.ruff]
line-length = 120
target-version = "py312"
src = ["src", "scripts", "tests", ".claude/skills/mnemosyne-cards"]
extend-exclude = ["services/anki-core", "ops/helios-hooks"]  # own style/deps; hooks follow homelab's stdlib style

[tool.ruff.lint.per-file-ignores]
# Standalone PEP 723 scripts keep a compact style (a local `q` query lambda).
"scripts/*" = ["E731"]

[tool.pyright]
include = ["src", "scripts", "tests", ".claude/skills/mnemosyne-cards", "services/watch/study.py"]
strict = ["src", "services/watch/study.py"]
pythonVersion = "3.12"
extraPaths = ["scripts", ".claude/skills/mnemosyne-cards", "services/watch"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "scripts", ".claude/skills/mnemosyne-cards", "services/watch"]
