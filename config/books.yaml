  # Computational science, self-study (2026-10-14): Strang's K = AᵀCA framework, Grady & Polimeni's discrete calculus
  # on graphs, and Bossavit's Whitney forms for Maxwell's equations.
  strang:
    name: Strang CSE
    title: Computational Science and Engineering
    calibre: 36        # a ClearScan scan: outline built from its printed contents and page labels added in Calibre
    slug: strang
    course: null
    aliases: [strang, strang-cse, cse]
  grady:
    name: Grady & Polimeni
    title: "Discrete Calculus: Applied Analysis on Graphs for Computational Science"
    calibre: 37        # bookmarks numbered as printed, and page labels added in Calibre (the PDF drops blank pages)
    slug: grady
