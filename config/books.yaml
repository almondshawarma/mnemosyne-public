# Textbooks mnemosyne can card from (the reading path, PLAN §4.1). A reading is a book plus where in it: a section
# from the book's outline ("2.3"), a chapter ("ch 2"), or pages as printed in the book ("p 39-47"). Books without an
# outline take pages only.
#   calibre: the book's id in Calibre (the number in its folder name, e.g. ".../Introduction to Plasma... (28)").
#   name:    what goes in the cards' Source field and in Paperless titles.
#   slug:    the tag, src::book::<slug>::<where> (e.g. src::book::chen::s2-3).
#   course:  set it when the book is a current course's textbook: its cards then go to Now and carry course::<code>.
#            Without one, cards are self-study and go to Core. A book several courses share maps chapters to courses
#            ({PHYS207: [21-32], PHYS221: [17-20, 33-36]}); chapters none of them covers are self-study.
#   aliases: the words that name the book at the start of a scan's title in Paperless ("Chen 2.3").
#   offset:  PDF page = printed page + offset, for PDFs without page labels (measured 2026-10-04). PDFs with page
#            labels (Chen, Serway, Leon, Haberman) map printed pages exactly; with neither, pages are PDF pages.
#   outline_shift: {from, by} when the PDF's bookmarks point `by` pages early from PDF page `from` on (Griffiths QM),
#            so a section doesn't lose its last page to the next one.
#   last_page: the PDF page the book ends on, when the file carries something else after it; nothing past it is read.
#            (University Physics had another book merged after p. 1596; trimmed in Calibre on 2026-10-06.)
#   first_page: the PDF page the book starts on, for one PDF holding two books (Hibbeler's Statics, then his
#            Dynamics, each numbered from p. 1): two entries share the Calibre id, each with its own pages.
#   number_sections: true when the outline names sections without numbers; they're numbered by page within each
#            chapter, as printed in the book (University Physics: "21.3 Coulomb's Law").
#
# Adding a book: put its PDF in Calibre (Calibre-Web's upload, or drop it in ~/helios/stack/books/ingest), then add an
# entry here with its Calibre id, and deploy. Check that its outline and printed pages land right (docs/deploy.md,
# "Readings"); measure an offset if the PDF has no page labels.
books:
  chen:
    name: Chen
    title: Introduction to Plasma Physics and Controlled Fusion
    calibre: 28
    slug: chen
    course: null
    aliases: [chen, plasma]
