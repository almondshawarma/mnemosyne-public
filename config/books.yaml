  # Hibbeler, Engineering Mechanics: Statics & Dynamics, 15th ed. (2026-10-12): one scanned PDF, OCR'd on the Obelisk,
  # with an outline from the book's contents and page labels added. Statics and Dynamics each number from p. 1, so
  # they're two entries; chapters 1-11 are Statics, 12-22 Dynamics. MEEN 221 covers 1-10, 12, and 13 (its syllabus).
  hibbeler-statics:
